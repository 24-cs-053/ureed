<!DOCTYPE html>
<html>
<head>
<title>Open New Account</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<nav class="navbar">
<div class="nav-container">
<h1 class="logo">BankHub</h1>
<ul class="nav-links">
<li><a href="home.html">Home</a></li>
<li><a href="register.html" class="active">Open Account</a></li>
<li><a href="display.php">View Records</a></li>
</ul>
</div>
</nav>
<div class="container">
<div class="form-wrapper">
<h2>Open New Account</h2>
<form method="POST" action="insert.php" onsubmit="return validateForm()">
<div class="form-group">
<label for="name">Customer Name</label>
<input type="text" id="name" name="name" required>
</div>
<div class="form-group">
<label for="age">Age</label>
<input type="number" id="age" name="age" min="18" required>
</div>
<div class="form-group">
<label for="address">Address</label>
<input type="text" id="address" name="address" required>
</div>
<div class="form-group">
<label for="branch">Bank Branch</label>
<select id="branch" name="branch" required>
<option value="">Select Branch</option>
<option value="Karachi Main">Karachi Main</option>
<option value="Islamabad">Islamabad</option>
<option value="Lahore">Lahore</option>
<option value="Multan">Multan</option>
</select>
</div>
<div class="form-group">
<label for="account_type">Account Type</label>
<select id="account_type" name="account_type" required>
<option value="">Select Type</option>
<option value="Savings">Savings</option>
<option value="Current">Current</option>
<option value="Business">Business</option>
</select>
</div>
<div class="form-group">
<label for="email">Email</label>
<input type="email" id="email" name="email" required>
</div>
<div class="form-group">
<label for="cnic">CNIC Number</label>
<input type="text" id="cnic" name="cnic" pattern="[0-9]{5}-[0-9]{7}-[0-9]" placeholder="12345-6789012-3" required>
</div>
<div class="form-group">
<label for="account_no">Account Number</label>
<input type="text" id="account_no" name="account_no" required>
</div>
<div class="form-group">
<label for="contact">Contact Number</label>
<input type="text" id="contact" name="contact" pattern="[0-9]{11}" placeholder="03001234567" required>
</div>
<div class="form-group">
<label for="balance">Initial Balance</label>
<input type="number" id="balance" name="balance" step="0.01" min="0" required>
</div>
<button type="submit" class="btn btn-submit">Create Account</button>
</form>
</div>
</div>
<script>
function validateForm() {
var name = document.getElementById("name").value.trim();
var age = document.getElementById("age").value;
var address = document.getElementById("address").value.trim();
var email = document.getElementById("email").value.trim();
if (name == "" || age == "" || address == "" || email == "") {
alert("All fields are required");
return false;
}
if (age < 18) {
alert("Age must be at least 18");
return false;
}
return true;
}
</script>
</body>
</html>
